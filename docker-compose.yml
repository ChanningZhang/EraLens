services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eralens-app
    environment:
      CONTENT_DB_PATH: /app/data/mobile/eralens-content.sqlite
      STATE_DB_PATH: /app/data/state/eralens-state.sqlite
      PORT: 8080
      HOST: 0.0.0.0
      STATIC_DIR: /app/apps/web/dist
    ports:
      - "8080:8080"
    volumes:
      - eralens_state:/app/data/state

volumes:
  eralens_state:
