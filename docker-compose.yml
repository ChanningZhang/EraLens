services:
  postgres:
    image: postgres:16-alpine
    container_name: eralens-postgres
    environment:
      POSTGRES_USER: eralens
      POSTGRES_PASSWORD: eralens
      POSTGRES_DB: eralens
    ports:
      - "5432:5432"
    volumes:
      - eralens_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eralens -d eralens"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eralens-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://eralens:eralens@postgres:5432/eralens
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: eralens
      DB_NAME: eralens
      PORT: 8080
      HOST: 0.0.0.0
      STATIC_DIR: /app/apps/web/dist
      RUN_SEED: ${RUN_SEED:-false}
    ports:
      - "8080:8080"

volumes:
  eralens_pg_data:
